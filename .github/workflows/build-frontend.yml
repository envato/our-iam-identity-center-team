name: Build Frontend

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'
      - '!amplify/**' # Exclude amplify (backend) directory
      - '!docs/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: aws-exports workaround
        run: cp deployment/aws-exports.staging.js src/aws-exports.js

      - name: Build the project
        run: GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true npm run build