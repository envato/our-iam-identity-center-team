name: Build Backend

on:
  pull_request:
    branches:
      - main
    paths:
      - 'amplify/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: 'amplify/backend/'
        run: npm i

      - name: Build the project
        working-directory: 'amplify/backend/'
        run: npm run build